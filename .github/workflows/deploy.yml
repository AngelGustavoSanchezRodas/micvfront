name: Despliegue Continuo Homelab

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar cambios del repositorio
        uses: actions/checkout@v4

      - name: Reconstruir y levantar contenedor
        run: |
          docker compose up -d --build --remove-orphans

      - name: Limpieza automática de residuos y caché
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=24h"